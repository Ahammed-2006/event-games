server {
    listen 80;
    server_name _; # Replace with your domain or IP address if you have one

    # Root directory for the Vite built static files
    root /home/ubuntu/event-games/client/dist; # Adjust this path to match your EC2 path
    index index.html;

    # Serve static frontend files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for the backend API
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Optional: increase timeouts if necessary
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
